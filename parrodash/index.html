#1a1a1a;border:1px solid #343434;color:#fff;border-radius:10px;padding:12px 13px;width:100%;font-size:13px}.search{width:220px}.button{border:0;background:#fff;color:#101010;border-radius:10px;padding:12px 16px;font-size:12px;font-weight:700;white-space:nowrap}.button.alt{background:#222;color:#fff;border:1px solid #353535}.button.danger{background:#37191b;color:#ff999f;border:1px solid #63262b}.button.sm{font-size:11px;padding:8px 11px}.button:hover{filter:brightness(.88)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#171717;border:1px solid #2a2a2a;border-radius:17px;padding:23px;min-width:0}.stat-label{font-size:12px;color:#aaa;display:flex;justify-content:space-between}.stat-number{font-size:34px;font-weight:660;letter-spacing:-1px;margin-top:29px}.stat-desc{font-size:11px;color:#838383;margin-top:6px}.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}.halves{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:10px}.card-head h2{font-weight:600;font-size:15px;margin:0}.muted{font-size:12px;color:#858585}.pill{background:#2a2a2a;border-radius:8px;padding:7px 10px;color:#aaa;font-size:11px}.tag{display:inline-flex;align-items:center;padding:5px 9px;border-radius:30px;background:#2d2d2d;color:#ddd;font-size:10px;text-transform:capitalize}.tag.green{color:#68daa1;background:#153125}.tag.red{color:#f18b92;background:#35191d}.tag.yellow{color:#f6cc67;background:#382f1b}.bars{height:210px;display:flex;align-items:end;gap:9px;padding:12px 0 0;border-bottom:1px solid #414141;background:repeating-linear-gradient(to top,transparent,transparent 51px,#292929 52px)}.bar{flex:1;min-width:3px;border-radius:5px 5px 0 0;background:#454545}.bar.latest{background:#eee}.axis{display:flex;justify-content:space-between;color:#888;font-size:10px;margin-top:12px}.list{display:grid;gap:11px}.list-item{display:flex;align-items:center;gap:12px;border-bottom:1px solid #292929;padding:8px 0 15px}.list-item:last-child{border:0}.list-item .grow{flex:1;min-width:0}.list-item b{font-size:12px;font-weight:600}.list-item small{color:#888;display:block;font-size:11px;margin-top:5px}.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#323232;color:#fff;font-weight:700;font-size:12px;flex-shrink:0}.progress{height:5px;border-radius:8px;overflow:hidden;background:#393939;margin-top:10px}.progress>span{height:100%;display:block;background:#c8c8c8;border-radius:8px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:590px;text-align:left}th{font-weight:500;color:#888;font-size:11px;padding:15px 9px;border-bottom:1px solid #3c3c3c}td{font-size:12px;padding:15px 9px;border-bottom:1px solid #303030}td:first-child{font-weight:600}.form{display:grid;gap:14px}.form.two-col{grid-template-columns:1fr 1fr}.field{display:grid;gap:7px;font-size:11px;color:#aaa}.field.wide{grid-column:1/-1}.field input,.field select,.field textarea{font-size:13px;resize:vertical}.button-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.notice{padding:12px 14px;font-size:12px;color:#aaa;background:#202020;border:1px solid #353535;border-radius:10px;margin-bottom:18px}.notice.warn{color:#edc778;border-color:#59451f}.notice.error{color:#ffa3a3;border-color:#6d2b2b}.note-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:15px}.note{background:#f1f1f1;border-radius:16px;padding:19px;color:#161616;min-height:175px}.note:nth-child(3n+2){background:#dfdfdf}.note:nth-child(3n){background:#c8c8c8}.note h3{margin:0 0 12px;font-size:17px}.note p{font-size:12px;white-space:pre-wrap;line-height:1.7}.note button{float:right;border:0;background:transparent;color:#555}.empty{color:#888;font-size:13px;padding:28px 0}.small{font-size:11px}.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 70% 0%,#262626 0,transparent 40%),#080808}.auth{max-width:420px;width:100%;border:1px solid #343434;border-radius:20px;padding:34px;background:#151515}.auth .mark{margin-bottom:25px}.auth h1{font-size:29px;letter-spacing:-1px;margin:0 0 9px}.auth p{font-size:12px;color:#929292;line-height:1.7;margin-bottom:27px}.auth .form{margin-top:18px}.auth-footer{font-size:11px;color:#777;margin-top:22px}.toast{position:fixed;bottom:22px;right:22px;background:#eee;color:#111;padding:14px 19px;border-radius:12px;box-shadow:0 12px 40px #0009;max-width:360px;font-size:12px;z-index:99}.toast.err{background:#42191e;color:#ffb9bc}.modalveil{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:15px;z-index:20}.modal{background:#181818;border:1px solid #373737;border-radius:20px;padding:25px;width:min(510px,100%);max-height:90vh;overflow:auto}.modal h2{margin:0 0 20px;font-size:20px}.foot{font-size:11px;color:#686868;margin-top:26px}.mobilemenu{display:none} @media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.two,.halves{grid-template-columns:1fr}.side{width:207px}}@media(max-width:700px){.app{display:block}.side{height:auto;min-height:0;width:100%;position:relative;padding:13px;gap:12px}.side-label,.bottom{display:none}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap;padding:10px}.main{padding:21px 13px}.top{align-items:start;flex-direction:column}.actions{width:100%}.search{flex:1;min-width:0}.stats{gap:9px}.card{padding:17px}.stat-number{font-size:26px;margin-top:18px}.form.two-col{grid-template-columns:1fr}}
</style></head><body><div id="root"><div class="login"><div class="auth"><div class="mark">P</div><h1>ParroDash</h1><p>Loading TPARRO workspace…</p></div></div></div><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const SUPABASE_URL='https://dkuzbhhvkyyizrlhuayl.supabase.co';const SUPABASE_PUBLISHABLE_KEY='sb_publishable_ZO1WFA4VkEzWdf0qnFCE1A_Krr4VRMk';
const root=document.querySelector('#root');
const db=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let dataErrors={};
let user=null,profile=null,current='Dashboard',records={},pending=false,authView='login',filter='';
const icons={Dashboard:'▦',People:'♧',Attendance:'◷',Leave:'▤',Tasks:'☷',Projects:'▧',Notes:'✎',Payroll:'◫',Announcements:'◉',Invites:'⊕',Audit:'⌁'};
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'—';
const fmtTime=d=>d?new Date(d).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const avatar=name=>`<div class="avatar">${safe((name||'?').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase())}</div>`;
const status=x=>`<span class="tag ${x==='approved'||x==='done'||x==='Active'||x==='active'?'green':x==='rejected'||x==='Overdue'||x==='inactive'?'red':x==='pending'||x==='in_progress'?'yellow':''}">${safe(String(x||'—').replaceAll('_',' '))}</span>`;
const card=(title,content,extra='')=>`<section class="card"><div class="card-head"><h2>${title}</h2>${extra}</div>${content}</section>`;
const noData=msg=>`<div class="empty">${safe(msg)}</div>`;
const allowed=()=>['admin','hr'].includes(profile?.role);
const leader=()=>allowed()||profile?.role==='manager';
const key=e=>e.target.closest('[data-action]');
const el=id=>document.getElementById(id);
function notify(msg,err=false){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),4500)}
async function run(operation){if(pending)return;pending=true;try{await operation()}catch(err){console.error(err);notify(err.message||'Something went wrong',true)}finally{pending=false}}
function authScreen(message=''){
 root.innerHTML=`<div class="login"><section class="auth"><div class="mark">P</div><h1>ParroDash<span style="color:#777">.</span></h1><p>TPARRO private team workspace. Sign in with your work email after activating your private invite link.</p>${message?`<div class="notice warn">${safe(message)}</div>`:''}<form class="form" id="auth-form"><label class="field">Work email<input class="input" type="email" name="email" required autocomplete="email" placeholder="you@tparro.com"></label><label class="field">Password<input class="input" name="password" type="password" required autocomplete="current-password" placeholder="Your account password"></label><button class="button" type="submit">Sign in</button></form><div class="auth-footer">New employee? Ask HR for your one-time invite link. Forgot password? Request a fresh access link from HR. No self-registration.</div></section></div>`;
 el('auth-form').onsubmit=e=>{e.preventDefault();return run(async()=>{
  const f=new FormData(e.target),email=String(f.get('email')||'').trim().toLowerCase(),password=String(f.get('password')||'');
  const r=await db.auth.signInWithPassword({email,password});
  if(r.error)throw r.error;
  await boot();
 })};
}
function setupScreen(){
 root.innerHTML=`<div class="login"><section class="auth"><div class="mark">P</div><h1>Welcome to TPARRO.</h1><p>Your invitation is verified. Create a password to activate your ParroDash account.</p><form class="form" id="setup-form"><label class="field">New password<input class="input" type="password" name="password" minlength="10" required autocomplete="new-password" placeholder="At least 10 characters"></label><label class="field">Confirm password<input class="input" type="password" name="confirmation" minlength="10" required autocomplete="new-password"></label><button class="button" type="submit">Activate my account</button></form><p class="auth-footer">Don't share your one-time invite link. This password will be used on future sign-ins.</p></section></div>`;
 el('setup-form').onsubmit=e=>{e.preventDefault();return run(async()=>{
  const f=new FormData(e.target),password=String(f.get('password')),other=String(f.get('confirmation'));
  if(password!==other)throw Error('Passwords do not match');
  const update=await db.auth.updateUser({password});
  if(update.error)throw update.error;
  const done=await db.rpc('finish_onboarding');
  if(done.error||done.data!==true)throw Error(done.error?.message||'Could not complete account activation');
  notify('Account activated. Welcome to ParroDash.');
  await boot();
 })};
}
async function launch(){
 const params=new URLSearchParams(location.hash.startsWith('#')?location.hash.slice(1):'');
 const token=params.get('pd_token'),flow=params.get('pd_flow');
 if(!token)return boot();
 history.replaceState(null,'',location.pathname+location.search);
 if(!['invite','recovery'].includes(flow)){authScreen('Invalid invite link');return}
 root.innerHTML='<div class="login"><div class="auth"><h1>Verifying invitation…</h1><p>This is a one-time access link.</p></div></div>';
 try{
  const result=await db.auth.verifyOtp({token_hash:token,type:flow});
  if(result.error)throw result.error;
  await boot();
 }catch(err){authScreen('This invite link is invalid, expired or already used. Ask HR to generate a new link. '+(err.message||''))}
}

function shell(){let pages=['Dashboard','People','Attendance','Leave','Tasks','Projects','Notes','Payroll','Announcements',...(allowed()?['Invites','Audit']:[])];root.innerHTML=`<div class="app"><aside class="side"><div class="brand"><span class="mark">P</span><div><b>parrodash</b><small>TPARRO WORKSPACE</small></div></div><div><div class="side-label">WORKSPACE</div><nav class="nav" id="navigation">${pages.map(p=>`<button data-page="${p}" class="${p===current?'on':''}"><span class="sym">${icons[p]}</span>${p}</button>`).join('')}</nav></div><div class="bottom"><div class="user">${safe(profile.full_name)}</div><div class="role">${safe(profile.title)} · ${safe(profile.role)}</div><button class="button alt sm" data-action="signout">Sign out ↗</button></div></aside><main class="main"><header class="top"><div><div class="eyebrow">TPARRO / Workspace / ${safe(current)}</div><h1>${current==='Dashboard'?'Workspace overview':safe(current)}</h1><p>One place for your team, work and people.</p></div><div class="actions"><input class="input search" id="search" placeholder="Search this page…" aria-label="Filter table"><button class="button" data-action="refresh">↻ Refresh</button></div></header><div id="content"></div><footer class="foot">© 2026 TPARRO · ParroDash · Secure team workspace</footer></main></div>`;
 root.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{current=b.dataset.page;filter='';render()});el('search').value=filter;el('search').oninput=e=>{filter=e.target.value.toLowerCase();filterPage()};
}
async function load(){
 let q=[['profiles','profiles'],['attendance','attendance'],['leave_requests','leaves'],['tasks','tasks'],['projects','projects'],['notes','notes'],['announcements','announcements'],['payroll_records','payroll'],...(allowed()?[['invites','invites'],['audit_events','audit']]:[])];
 dataErrors={};
 let results=await Promise.all(q.map(async([table,alias])=>{
  const r=await db.from(table).select('*').order(table==='profiles'?'joined_at':table==='invites'?'created_at':table==='attendance'?'clock_in':table==='payroll_records'?'period':table==='audit_events'?'occurred_at':'created_at',{ascending:false}).limit(300);
  if(r.error){dataErrors[alias]=r.error.message;return[alias,[]]}
  return[alias,r.data||[]]
 }));
 records=Object.fromEntries(results)
}
async function boot(){
 const s=await db.auth.getUser();
 if(s.error||!s.data.user){user=null;profile=null;authScreen();return}
 user=s.data.user;
 const claim=await db.rpc('claim_existing_invitation');
 if(claim.error)console.warn('Invitation claim:',claim.error.message);
 const r=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();
 if(r.error){authScreen('Unable to load your employee profile: '+r.error.message);return}
 if(!r.data||!r.data.active){root.innerHTML=`<div class="login"><div class="auth"><div class="mark">P</div><h1>Access not activated</h1><p>Ask TPARRO HR to invite your exact work email and share a fresh activation link.</p><button class="button alt" id="logout">Sign out</button></div></div>`;el('logout').onclick=()=>db.auth.signOut().then(()=>authScreen());return}
 profile=r.data;
 if(!profile.onboarded_at){setupScreen();return}
 try{await load();render()}catch(e){root.innerHTML=`<div class="login"><div class="auth"><h1>Could not load workspace</h1><p>${safe(e.message)}</p><button class="button" id="retry">Retry</button></div></div>`;el('retry').onclick=boot}
}

function filterPage(){document.querySelectorAll('#content [data-filter]').forEach(x=>{x.style.display=x.textContent.toLowerCase().includes(filter)?'':'none'})}
const myname=id=>records.profiles?.find(p=>p.id===id)?.full_name||'Former employee';
const personRows=()=>records.profiles.map(p=>`<tr data-filter><td><div style="display:flex;gap:10px;align-items:center">${avatar(p.full_name)}<span>${safe(p.full_name)}<small style="display:block;color:#777;margin-top:3px">${safe(p.email)}</small></span></div></td><td>${safe(p.title)}</td><td>${safe(p.department)}</td><td>${status(p.active?(p.onboarded_at?'Active':'pending'):'inactive')}</td><td>${allowed()?`<button class="button alt sm" data-action="edit-person" data-id="${p.id}">Edit</button>`:safe(p.role)}</td></tr>`).join('');
function stats(){let people=records.profiles.filter(p=>p.active&&p.onboarded_at).length,pending=records.leaves.filter(l=>l.status==='pending').length,done=records.tasks.filter(t=>t.status==='done').length,active=records.projects.filter(p=>p.status==='Active').length;return `<div class="stats">${[['Team members',people,'Active employees'],['Leave requests',pending,'Awaiting HR review'],['Tasks completed',done+' / '+records.tasks.length,'Across accessible tasks'],['Active projects',active,'Current workstreams']].map(([name,val,sub])=>`<section class="card"><div class="stat-label">${name}<span>↗</span></div><div class="stat-number">${val}</div><div class="stat-desc">${sub}</div></section>`).join('')}</div>`}
function dashboard(){let recent=records.attendance.slice(0,10);let people=records.profiles.slice(0,5);let summaries=records.announcements.slice(0,4);return stats()+`<div class="two">${card('Team activity <span class="pill">Recent attendance</span>',`<div class="bars">${Array.from({length:14},(_,i)=>{let day=new Date();day.setDate(day.getDate()-13+i);let total=records.attendance.filter(a=>new Date(a.clock_in).toDateString()===day.toDateString()).length;return `<div class="bar ${i===13?'latest':''}" title="${total} shifts" style="height:${Math.max(5,Math.min(100,total*18+4))}%"></div>`}).join('')}</div><div class="axis"><span>13 days ago</span><span>7 days ago</span><span>Today</span></div><p class="muted">Shows up to 300 recent shifts visible to your role. No simulated attendance.</p>`)}${card('Latest announcements',summaries.map(x=>`<div class="list-item" data-filter><div class="avatar">◉</div><div class="grow"><b>${safe(x.title)}</b><small>${safe(x.body.slice(0,100))} · ${fmt(x.created_at)}</small></div></div>`).join('')||noData('No announcements yet.'))}</div><div class="halves">${card('Team directory',people.map(p=>`<div class="list-item" data-filter>${avatar(p.full_name)}<div class="grow"><b>${safe(p.full_name)}</b><small>${safe(p.title)} · ${safe(p.department)}</small></div>${status(p.active?(p.onboarded_at?'Active':'pending'):'inactive')}</div>`).join('')||noData('No employees'))}${card('Recent leave requests',records.leaves.slice(0,6).map(l=>`<div class="list-item" data-filter>${avatar(myname(l.user_id))}<div class="grow"><b>${safe(myname(l.user_id))}</b><small>${safe(l.kind)} · ${fmt(l.start_date)} — ${fmt(l.end_date)}</small></div>${status(l.status)}</div>`).join('')||noData('No leave requests'))}</div>`}
function people(){return `${allowed()?`<div class="button-row" style="margin-bottom:17px"><button class="button" data-action="invite">+ Invite employee</button></div>`:''}${card('Employee directory',`<div class="tablewrap"><table><thead><tr><th>Employee</th><th>Role</th><th>Department</th><th>Status</th><th>Action</th></tr></thead><tbody>${personRows()}</tbody></table></div>`)}`}
function attendance(){let open=records.attendance.find(x=>x.user_id===user.id&&!x.clock_out);return `<div class="notice">Clock times are recorded on the database server. These are self-service timestamps, not GPS or biometric verification.</div><div class="button-row" style="margin-bottom:17px"><button class="button ${open?'danger':''}" data-action="${open?'clock-out':'clock-in'}">${open?'◷ Clock out':'◷ Clock in'}</button>${open?`<span class="tag green">On shift since ${fmtTime(open.clock_in)}</span>`:status('Not clocked in')}</div>${card('Attendance history',`<div class="tablewrap"><table><thead><tr><th>Employee</th><th>Clock in</th><th>Clock out</th><th>Status</th></tr></thead><tbody>${records.attendance.map(a=>`<tr data-filter><td>${safe(myname(a.user_id))}</td><td>${fmtTime(a.clock_in)}</td><td>${fmtTime(a.clock_out)}</td><td>${status(a.clock_out?'Completed':'Active')}</td></tr>`).join('')}</tbody></table></div>${records.attendance.length?'':noData('No shifts recorded yet.')}`)}`}
function leave(){return `<div class="button-row" style="margin-bottom:17px"><button class="button" data-action="new-leave">+ Request leave</button></div>${card('Leave requests',`<div class="tablewrap"><table><thead><tr><th>Employee</th><th>Type</th><th>Dates</th><th>Reason</th><th>Status</th><th>Review</th></tr></thead><tbody>${records.leaves.map(l=>`<tr data-filter><td>${safe(myname(l.user_id))}</td><td>${safe(l.kind)}</td><td>${fmt(l.start_date)} – ${fmt(l.end_date)}</td><td>${safe(l.reason)}</td><td>${status(l.status)}</td><td>${allowed()&&l.status==='pending'?`<button class="button sm" data-action="review" data-id="${l.id}" data-value="approved">Approve</button> <button class="button danger sm" data-action="review" data-id="${l.id}" data-value="rejected">Reject</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>${records.leaves.length?'':noData('No leave requests yet.')}`)}`}
function tasks(){return `${leader()?'<div class="button-row" style="margin-bottom:17px"><button class="button" data-action="new-task">+ Assign task</button></div>':''}${card('Team tasks',`<div class="tablewrap"><table><thead><tr><th>Task</th><th>Assigned to</th><th>Project</th><th>Due</th><th>Status</th></tr></thead><tbody>${records.tasks.map(t=>`<tr data-filter><td>${safe(t.title)}</td><td>${safe(myname(t.assigned_to))}</td><td>${safe(records.projects.find(x=>x.id===t.project_id)?.name||'General')}</td><td>${fmt(t.due_date)}</td><td><select class="input" data-action="task-status" data-id="${t.id}" style="min-width:120px">${[['todo','To do'],['in_progress','In progress'],['done','Done']].map(([v,l])=>`<option value="${v}" ${t.status===v?'selected':''}>${l}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>${records.tasks.length?'':noData('No tasks have been assigned.')}`)}`}
function projects(){return `${leader()?'<div class="button-row" style="margin-bottom:17px"><button class="button" data-action="new-project">+ New project</button></div>':''}<div class="note-grid">${records.projects.map(p=>`<section class="card" data-filter><div class="card-head"><h2>${safe(p.name)}</h2>${status(p.status)}</div><p class="muted">${safe(p.description||'No description')}</p><div class="stat-desc">${records.tasks.filter(t=>t.project_id===p.id).length} assigned tasks</div></section>`).join('')||noData('No projects yet.')}</div>`}
function notes(){return `<div class="button-row" style="margin-bottom:17px"><button class="button" data-action="new-note">+ New private note</button></div><div class="note-grid">${records.notes.map(n=>`<div class="note" data-filter><button data-action="delete-note" data-id="${n.id}" aria-label="Delete note">✕</button><h3>${safe(n.title)}</h3><p>${safe(n.body)}</p><small>${fmt(n.created_at)}</small></div>`).join('')||noData('No private notes yet.')}</div>`}
function payroll(){return `${allowed()?'<div class="button-row" style="margin-bottom:17px"><button class="button" data-action="new-payroll">+ Add payroll record</button></div>':''}<div class="notice">Private payroll records: visible only to their employee and HR administrators. This is a record ledger, not a tax-calculating or payment-processing engine.</div>${card('Payroll records',`<div class="tablewrap"><table><thead><tr><th>Employee</th><th>Period</th><th>Base</th><th>Allowances</th><th>Deductions</th><th>Net</th></tr></thead><tbody>${records.payroll.map(p=>`<tr data-filter><td>${safe(myname(p.user_id))}</td><td>${fmt(p.period)}</td><td>${p.currency} ${Number(p.base_pay).toLocaleString()}</td><td>${Number(p.allowances).toLocaleString()}</td><td>${Number(p.deductions).toLocaleString()}</td><td><b>${p.currency} ${(Number(p.base_pay)+Number(p.allowances)-Number(p.deductions)).toLocaleString()}</b></td></tr>`).join('')}</tbody></table></div>${records.payroll.length?'':noData('No payroll records yet.')}`)}`}
function announcements(){return `${allowed()?'<div class="button-row" style="margin-bottom:17px"><button class="button" data-action="new-announcement">+ Publish announcement</button></div>':''}<div class="list">${records.announcements.map(a=>card(safe(a.title),`<div class="muted" style="white-space:pre-wrap;line-height:1.8">${safe(a.body)}</div><p class="stat-desc">Published ${fmtTime(a.created_at)}</p>`)).join('')||noData('No announcements yet.')}</div>`}
function invites(){
 const staged=records.invites||[];
 const onboarding=(records.profiles||[]).filter(p=>p.active&&!p.onboarded_at);
 const queuedRows=staged.map(i=>`<tr data-filter><td>${safe(i.email)}</td><td>${safe(i.name)}</td><td>${safe(i.role)}</td><td>${safe(i.department)}</td><td><button class="button alt sm" data-action="issue-invite" data-email="${safe(i.email)}">Generate link</button> <button class="button danger sm" data-action="delete-invite" data-id="${safe(i.email)}">Remove</button></td></tr>`).join('');
 const setupRows=onboarding.map(p=>`<tr data-filter><td>${safe(p.email)}</td><td>${safe(p.full_name)}</td><td>${safe(p.role)}</td><td>${safe(p.department)}</td><td><button class="button alt sm" data-action="issue-invite" data-email="${safe(p.email)}">New link</button></td></tr>`).join('');
 return `<div class="button-row" style="margin-bottom:17px"><button class="button" data-action="invite">+ Generate employee invite</button></div><div class="notice warn"><b>Manual delivery:</b> Create a secure one-time link, then copy it or open an email draft to send it privately. No automatic invitation emails are sent until transactional SMTP is configured. Public self-registration is disabled.</div>${card('Pending invitations',`<div class="tablewrap"><table><thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Department</th><th>Actions</th></tr></thead><tbody>${queuedRows}${setupRows}</tbody></table></div>${queuedRows||setupRows?'':noData('No pending invitations. Invite a staff member to get started.')}`)}
`;
}
function inviteLinkDialog(email,url){
 const old=document.querySelector('.modalveil');if(old)old.remove();
 const veil=document.createElement('div');veil.className='modalveil';
 veil.innerHTML=`<section class="modal" role="dialog" aria-modal="true"><h2>Secure invite link created</h2><div class="notice warn"><b>No email has been sent.</b> This is a single-use private access link. Share it only with ${safe(email)} via a trusted channel.</div><label class="field">One-time invitation link<input class="input" id="invitation-copy" readonly value="${safe(url)}"></label><div class="button-row" style="margin-top:16px"><button class="button" id="copy-invite">Copy link</button><button class="button alt" id="email-invite">Open email draft</button><button class="button alt" id="close-invite">Close</button></div><p class="muted">The employee opens the link, creates a password, and can then sign in normally. If the link expires, generate a fresh one.</p></section>`;
 document.body.appendChild(veil);
 veil.querySelector('#close-invite').onclick=()=>veil.remove();
 veil.querySelector('#copy-invite').onclick=async()=>{
  try{await navigator.clipboard.writeText(url);notify('Invite link copied')}catch(e){const input=veil.querySelector('#invitation-copy');input.focus();input.select();notify('Select the link and copy it manually')}
 };
 veil.querySelector('#email-invite').onclick=()=>{
  const subject='Your TPARRO ParroDash invitation';
  const text='You have been invited to TPARRO ParroDash. Open this private one-time link and set a password:\n\n'+url+'\n\nDo not forward this invitation.';
  window.location.href='mailto:'+encodeURIComponent(email)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(text);
 };
}
async function issueInvite(body){
 const {data,error}=await db.functions.invoke('staff-invite',{body});
 if(error){let message=error.message||'Invitation service failed';try{const detail=await error.context?.json?.();if(detail?.error)message=detail.error}catch{}throw Error(message)}
 if(data?.error)throw Error(data.error);
 if(!data?.tokenHash||!['invite','recovery'].includes(data.flow))throw Error('No invitation link returned from the server');
 const url=location.origin+location.pathname+'#pd_token='+encodeURIComponent(data.tokenHash)+'&pd_flow='+encodeURIComponent(data.flow);
 return {inviteUrl:url,inviteEmail:data.email};
}

function audit(){return card('HR audit history',`<div class="tablewrap"><table><thead><tr><th>When</th><th>Actor</th><th>Entity</th><th>Action</th></tr></thead><tbody>${(records.audit||[]).map(a=>`<tr data-filter><td>${fmtTime(a.occurred_at)}</td><td>${safe(myname(a.actor_id))}</td><td>${safe(a.entity)}</td><td>${safe(a.action)}</td></tr>`).join('')}</tbody></table></div>${records.audit.length?'':noData('No audit events yet.')}`)}
function render(){shell();const views={Dashboard:dashboard,People:people,Attendance:attendance,Leave:leave,Tasks:tasks,Projects:projects,Notes:notes,Payroll:payroll,Announcements:announcements,Invites:invites,Audit:audit};el('content').innerHTML=(Object.keys(dataErrors).length?'<div class="notice warn">Some modules could not load: '+safe(Object.entries(dataErrors).map(([k,v])=>k+': '+v).join(' | '))+'</div>':'')+views[current]();filterPage();root.querySelectorAll('[data-action]').forEach(b=>{if(b.dataset.action==='task-status'){b.onchange=()=>handle(b.dataset.action,b);return}b.onclick=()=>handle(b.dataset.action,b)})}
function modal(title,fields,onSubmit){const veil=document.createElement('div');veil.className='modalveil';veil.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-label="${safe(title)}"><h2>${safe(title)}</h2><form class="form" id="modalform">${fields}<div class="button-row"><button class="button" type="submit">Save</button><button class="button alt" type="button" id="cancel">Cancel</button></div></form></section>`;document.body.appendChild(veil);veil.querySelector('#cancel').onclick=()=>veil.remove();veil.onclick=e=>{if(e.target===veil)veil.remove()};veil.querySelector('form').onsubmit=e=>{e.preventDefault();run(async()=>{const outcome=await onSubmit(new FormData(e.target));veil.remove();await load();render();if(outcome?.inviteUrl)inviteLinkDialog(outcome.inviteEmail,outcome.inviteUrl);else notify('Saved successfully')})}}
const field=(label,name,type='text',required=true,extra='')=>`<label class="field">${label}<input class="input" name="${name}" type="${type}" ${required?'required':''} ${extra}></label>`;
const select=(label,name,choices)=>`<label class="field">${label}<select class="input" name="${name}" required>${choices.map(([v,t])=>`<option value="${safe(v)}">${safe(t)}</option>`).join('')}</select></label>`;
const peopleOptions=()=>records.profiles.filter(p=>p.active).map(p=>[p.id,p.full_name]);
async function insert(table,data){const r=await db.from(table).insert(data);if(r.error)throw r.error}
async function handle(action,btn){if(action==='signout'){await db.auth.signOut();user=profile=null;authScreen();return}if(action==='refresh'){await run(async()=>{await load();render();notify('Workspace up to date')});return}
if(action==='clock-in'||action==='clock-out'){return run(async()=>{const r=await db.rpc(action==='clock-in'?'clock_in_now':'clock_out_now');if(r.error)throw r.error;await load();render();notify(action==='clock-in'?'Clocked in':'Clocked out')})}
if(action==='invite'){return modal('Generate employee invite',field('Employee email','email','email')+field('Full name','name')+select('Role','role',[['employee','Employee'],['manager','Manager'],['hr','HR admin'],...(profile.role==='admin'?[['admin','Super admin']]:[])])+field('Department','department','text',true,'value="General"')+field('Job title','title','text',true,'value="Team member"'),async f=>issueInvite({action:'create',email:String(f.get('email')).trim().toLowerCase(),name:f.get('name'),role:f.get('role'),department:f.get('department'),title:f.get('title')}))}
if(action==='issue-invite'){return run(async()=>{const result=await issueInvite({action:'issue_existing',email:btn.dataset.email});await load();render();inviteLinkDialog(result.inviteEmail,result.inviteUrl)})}
if(action==='delete-invite'){if(!confirm('Remove this invitation?'))return;return run(async()=>{let r=await db.from('invites').delete().eq('email',btn.dataset.id);if(r.error)throw r.error;await load();render()})}
if(action==='edit-person'){let p=records.profiles.find(x=>x.id===btn.dataset.id);return modal('Edit employee',field('Name','full_name','text',true,`value="${safe(p.full_name)}"`)+field('Title','title','text',true,`value="${safe(p.title)}"`)+field('Department','department','text',true,`value="${safe(p.department)}"`)+select('Role','role',[[p.role,p.role],...['employee','manager','hr','admin'].filter(x=>x!==p.role).map(x=>[x,x])])+select('Account status','active',[[String(p.active),p.active?'Active':'Inactive'],[String(!p.active),p.active?'Inactive':'Active']]),async f=>{let r=await db.from('profiles').update({full_name:f.get('full_name'),title:f.get('title'),department:f.get('department'),role:f.get('role'),active:f.get('active')==='true'}).eq('id',p.id);if(r.error)throw r.error})}
if(action==='new-leave'){return modal('Request time off',select('Leave type','kind',['Annual','Casual','Sick','Unpaid','Other'].map(x=>[x,x]))+field('Start','start_date','date')+field('End','end_date','date')+`<label class="field">Reason<textarea class="input" name="reason" rows="3" maxlength="600"></textarea></label>`,async f=>{if(f.get('start_date')>f.get('end_date'))throw Error('End date must be after start date');await insert('leave_requests',{user_id:user.id,kind:f.get('kind'),start_date:f.get('start_date'),end_date:f.get('end_date'),reason:f.get('reason')})})}
if(action==='review'){if(!confirm(`Mark leave ${btn.dataset.value}?`))return;return run(async()=>{const r=await db.from('leave_requests').update({status:btn.dataset.value,reviewed_at:new Date().toISOString(),reviewed_by:user.id}).eq('id',btn.dataset.id).eq('status','pending');if(r.error)throw r.error;await load();render();notify('Request reviewed')})}
if(action==='new-task'){return modal('Assign a task',field('Task title','title')+select('Assigned to','assigned_to',peopleOptions())+select('Project','project_id',[['','General'],...records.projects.map(p=>[p.id,p.name])])+field('Due date','due_date','date',false),async f=>insert('tasks',{title:f.get('title'),assigned_to:f.get('assigned_to'),project_id:f.get('project_id')||null,due_date:f.get('due_date')||null,created_by:user.id}))}
if(action==='task-status'){return run(async()=>{let r=await db.from('tasks').update({status:btn.value}).eq('id',btn.dataset.id);if(r.error)throw r.error;await load();render();notify('Task updated')})}
if(action==='new-project'){return modal('Create project',field('Project name','name')+`<label class="field">Description<textarea class="input" name="description" rows="3"></textarea></label>`,async f=>insert('projects',{name:f.get('name'),description:f.get('description'),created_by:user.id}))}
if(action==='new-note'){return modal('New private note',field('Title','title')+`<label class="field">Content<textarea class="input" name="body" rows="5" required></textarea></label>`,async f=>insert('notes',{owner_id:user.id,title:f.get('title'),body:f.get('body')}))}
if(action==='delete-note'){if(!confirm('Delete this note?'))return;return run(async()=>{const r=await db.from('notes').delete().eq('id',btn.dataset.id);if(r.error)throw r.error;await load();render()})}
if(action==='new-announcement'){return modal('Publish announcement',field('Title','title')+`<label class="field">Message<textarea class="input" name="body" rows="5" required></textarea></label>`,async f=>insert('announcements',{title:f.get('title'),body:f.get('body'),created_by:user.id}))}
if(action==='new-payroll'){return modal('Add payroll record',select('Employee','user_id',peopleOptions())+field('Period','period','month')+select('Currency','currency',[['BDT','BDT'],['USD','USD'],['EUR','EUR']])+field('Base pay','base_pay','number',true,'min="0" step="0.01"')+field('Allowances','allowances','number',true,'value="0" step="0.01"')+field('Deductions','deductions','number',true,'value="0" step="0.01"'),async f=>insert('payroll_records',{user_id:f.get('user_id'),period:f.get('period')+'-01',currency:f.get('currency'),base_pay:f.get('base_pay'),allowances:f.get('allowances'),deductions:f.get('deductions')}))}
}
if(SUPABASE_PUBLISHABLE_KEY.includes('REPLACE_WITH')){root.innerHTML='<div class="login"><div class="auth"><h1>Configuration required</h1></div></div>'}else{db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){user=null;profile=null;authScreen()}});launch()}
</script></body></html>
