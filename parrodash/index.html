 const b=Math.max(0,n(baseline)),h=Math.max(0,Math.trunc(n(hires))),s=Math.max(0,n(avg_salary)),r=Math.max(-100,Math.min(1000,n(raise_pct))),f=Math.max(0,Math.min(1000,n(benefits_pct))),m=Math.max(1,Math.min(60,Math.trunc(n(months))));
 const old=b*m;const monthly=(b*(1+r/100)+h*s)*(1+f/100);
 return {baseline:b,month:Math.round(monthly*100)/100,prior:Math.round(old*100)/100,total:Math.round(monthly*m*100)/100,increment:Math.round((monthly*m-old)*100)/100,months:m};

function agentDrafts(query,r,now=new Date()){
 const text=String(query||'').toLowerCase();const out=[];
 const nextStart=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()+1,1));
 const nextEnd=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()+2,1));
 const wantsContracts=/contract|renew|expir|চুক্তি/.test(text);
 const wantsAttendance=/attendance|shift|clock|missing|উপস্থিতি/.test(text);
 const wantsPayroll=/payroll|salary|deduction|বেতন/.test(text);
 const wantsLeaves=/leave|approval|ছুটি/.test(text)&&!wantsContracts;
 const maxMatch=text.match(/\b(\d{1,3})\b/);const cap=maxMatch?Math.min(100,Math.max(1,+maxMatch[1])):100;
 const list=(rows,fn)=>{for(const row of rows||[]){if(out.length>=cap)break;const item=fn(row);if(item)out.push(item)}};
 if(wantsContracts){list((r.contracts||[]).filter(c=>{let x=new Date(c.end_date+'T00:00:00Z');return x>=nextStart&&x<nextEnd&&c.status==='Active'}),c=>({type:'contract_renewal',target_user_id:c.user_id,contract_id:c.id,title:`Renewal review: ${r.profiles?.find(p=>p.id===c.user_id)?.full_name||'Team member'}`,draft:`Contract ${c.employment_type} expires on ${c.end_date}. Prepare a ${c.renewal_months}-month renewal proposal for executive review. Do not alter terms or extend employment until authorized.`}));}
 if(wantsAttendance){list((r.attendance||[]).filter(a=>!a.clock_out&&relDays(a.clock_in,now.getTime())>=1),a=>({type:'attendance_followup',target_user_id:a.user_id,title:'Attendance correction follow-up',draft:`An open attendance shift started ${fmtTime(a.clock_in)}. Ask the employee to verify the recorded time. Do not change attendance without review.`}));}
 if(wantsPayroll){list((r.salary_corrections||[]).filter(c=>c.status==='pending'),c=>({type:'payroll_review',target_user_id:c.user_id,title:'Salary discrepancy review',draft:`Employee raised a salary correction request: ${c.reason}. Compare line items and supporting records before any payroll adjustment.`}));}
 if(wantsLeaves){list((r.leave_requests||[]).filter(l=>l.status==='pending'&&relDays(l.created_at,now.getTime())>=2),l=>({type:'leave_followup',target_user_id:l.user_id,title:'Pending leave approval reminder',draft:`${l.kind} leave requested for ${l.start_date} to ${l.end_date}. Notify executive for review; no automatic approval or rejection.`}));}

}
function buildFindings(records,now=new Date()){
 const r=records||{},findings=[],nowTime=now.getTime();
 const hours=Number(r.policy_rules?.find(p=>p.key==='attendance_alert_hours')?.number_value||14);
 const days=Number(r.policy_rules?.find(p=>p.key==='approval_alert_days')?.number_value||3);
 for(const a of r.attendance||[]){if(!a.clock_out && (nowTime-new Date(a.clock_in).getTime())/3600000>hours){findings.push({finding_key:'attendance:'+a.id,type:'attendance',subject_id:a.id,description:`Open shift since ${fmtTime(a.clock_in)} for ${r.profiles?.find(p=>p.id===a.user_id)?.full_name||'employee'}`,suggested_action:'Request an attendance correction; do not auto-edit logged hours',target_user_id:a.user_id,action:'attendance_followup'});}}
 for(const l of r.leave_requests||[]){if(l.status==='pending'&&relDays(l.created_at,nowTime)>=days){findings.push({finding_key:'leave:'+l.id,type:'leave',subject_id:l.id,description:`Leave request waiting ${relDays(l.created_at,nowTime)} days`,suggested_action:'Notify founder/CEO to review',target_user_id:l.user_id,action:'leave_followup'});}}
 for(const c of r.contracts||[]){let diff=daysUntil(c.end_date,nowTime);if(c.status==='Active'&&diff<=30&&diff>=0){findings.push({finding_key:'contract:'+c.id,type:'contract',subject_id:c.id,description:`Contract expires in ${diff} days`,suggested_action:'Prepare renewal draft for approval',target_user_id:c.user_id,contract_id:c.id,action:'contract_renewal'});}}

 for(const c of r.salary_corrections||[]){if(c.status==='pending'&&relDays(c.created_at,nowTime)>=days){findings.push({finding_key:'correction:'+c.id,type:'payroll',subject_id:c.id,description:'Unresolved salary correction request',suggested_action:'Assign HR review; do not automatically alter pay',target_user_id:c.user_id,action:'payroll_review'});}}
 return findings;
}
function parseCSV(text){const rows=[];let field='',row=[],inQuote=false;const s=String(text||'').replace(/^\uFEFF/,'');for(let i=0;i<s.length;i++){const ch=s[i];if(inQuote){if(ch==='"'&&s[i+1]==='"'){field+='"';i++}else if(ch==='"')inQuote=false;else field+=ch;}else if(ch==='"'){inQuote=true}else if(ch===','){row.push(field);field=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&s[i+1]==='\n')i++;row.push(field);if(row.some(v=>v.trim()))rows.push(row);row=[];field=''}else field+=ch;}if(inQuote)throw Error('Unclosed quote in CSV');row.push(field);if(row.some(v=>v.trim()))rows.push(row);if(!rows.length)return[];const columns=rows.shift().map(x=>x.trim().toLowerCase());return rows.map(c=>Object.fromEntries(columns.map((k,i)=>[k,(c[i]||'').trim()])));}
function toCSV(rows){if(!rows?.length)return'';const cols=[...new Set(rows.flatMap(x=>Object.keys(x)))];const protect=x=>{let s=String(x??'');if(/^[=+@\-]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};return [cols.map(protect).join(','),...rows.map(r=>cols.map(c=>protect(r[c])).join(','))].join('\r\n');}

const kpi=(title,value,note,ic='chart')=>`<div class="stat"><div class="stat-top"><span>${esc(title)}</span>${icon(ic,18)}</div><div class="stat-value">${esc(value)}</div><div class="stat-note">${note}</div></div>`;
const workload=(ctx,p)=>{const tasks=rows(ctx,'tasks').filter(t=>t.assigned_to===p.id && t.status!=='done');const hours=tasks.reduce((v,t)=>v+n(t.estimate_hours),0);const cap=n(p.weekly_capacity_hours)||40;const percent=Math.round(hours/cap*100);return {hours,cap,percent,tasks:tasks.length};};
const alertFor=(ctx,p)=>{const x=workload(ctx,p).percent;return x>100?'red':x>=80?'yellow':''};
const personCell=(ctx,id)=>person(who(ctx,id));
const mast=(ctx,page)=>{const member=me(ctx),tabs=page==='tasks'?'Work management':page==='inbox'?'Decision center':page==='home'?'Workspace home':'Workspace';const label=exec(member)?'Founder / CEO':member.role==='admin'||member.role==='hr'?'HR operations':member.role==='manager'?'Team manager':'Employee portal';return `<div class="welcome"><div><p class="eyebrow">${esc(tabs)} · ${esc(label)}</p><h1>${page==='home'?`Good ${new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening'}, ${esc(member.full_name?.split(' ')[0]||'team')}.`:NAV[page]?.title||'ParroDash'}</h1><p>${page==='home'?'Here’s what needs your attention across the workspace.':'TPARRO Workspace · '+new Intl.DateTimeFormat('en-GB',{dateStyle:'full',timeZone:'Asia/Dhaka'}).format(new Date())}</p></div><div class="right"><button class="btn" data-act="refresh">${icon('refresh')} Refresh</button>${page==='home'&&leadR(ctx)?`<button class="btn primary" data-act="quick-task">${icon('plus')} New task</button>`:''}</div></div>`;};

function dashboard(ctx){
 const registrations=rows(ctx,'profiles').filter(p=>p.signup_method==='self'&&p.registration_status==='pending'&&!p.active);
 const people=activeMembers(ctx), allTasks=rows(ctx,'tasks'), leaves=rows(ctx,'leave_requests'),pending=leaves.filter(x=>x.status==='pending'),approvals=rows(ctx,'approval_queue').filter(a=>a.status==='pending'),contracts=rows(ctx,'contracts');
 const mine=allTasks.filter(x=>x.assigned_to===ctx.user.id), myShift=rows(ctx,'attendance').find(a=>a.user_id===ctx.user.id&&!a.clock_out),projects=rows(ctx,'projects');
 const isExecutive=inR(ctx),isHr=hrR(ctx);
 const top=isExecutive?[
   kpi('Team members',people.length,`${registrations.length} new sign-ups awaiting approval`,'users'),
   kpi('Leave decisions',pending.length,`<span class="${pending.length?'warn':''}">Executive approval required</span>`,'calendar'),
   kpi('Action approvals',approvals.length,'Plans waiting for your decision','shield'),
   kpi('Active projects',projects.filter(p=>p.status==='Active').length,`${allTasks.filter(t=>t.status!=='done').length} open tasks`,'briefcase')]:isHr?[
   kpi('Active colleagues',people.length,'Across TPARRO teams','users'),
   kpi('Pending salary cases',rows(ctx,'salary_corrections').filter(x=>x.status==='pending').length,'Open corrections','wallet'),
   kpi('Expiring contracts',contracts.filter(c=>c.status==='Active'&&daysUntil(c.end_date)>=0&&daysUntil(c.end_date)<=30).length,'Next 30 days','file'),
   kpi('Open tasks',allTasks.filter(t=>t.status!=='done').length,'Across the workspace','tasks')]:[
   kpi('My open tasks',mine.filter(t=>t.status!=='done').length,`${mine.filter(t=>t.status==='done').length} completed`,'tasks'),
   kpi('Leave requests',leaves.filter(x=>x.user_id===ctx.user.id).length,`${leaves.filter(x=>x.user_id===ctx.user.id&&x.status==='pending').length} pending`,'calendar'),
   kpi('Attendance',myShift?'Clocked in':'Not clocked in',myShift?`Since ${fmtTime(myShift.clock_in)}`:'Start tracking when you begin work','clock'),
   kpi('My projects',new Set(mine.map(t=>t.project_id).filter(Boolean)).size,'From your assigned tasks','briefcase')];
 const chart=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));const iso=d.toISOString().slice(0,10);return {d:d.toLocaleDateString('en-GB',{weekday:'short'}),total:rows(ctx,'tasks').filter(t=>t.created_at?.slice(0,10)===iso).length};});
 const max=Math.max(1,...chart.map(x=>x.total));
 const chartHtml=`<div class="bar-chart">${chart.map(x=>`<div class="bar" style="height:${Math.max(3,Math.round(x.total/max*100))}%" title="${esc(x.d)}: ${x.total}"></div>`).join('')}</div><div class="chart-axis">${chart.map(x=>`<span>${esc(x.d)}</span>`).join('')}</div><p class="chart-caption">Tasks created each day, last seven days. Based on saved creation dates.</p>`;
 const required=isExecutive?`<div class="mini-list">${registrations.slice(0,3).map(p=>mini(`${esc(p.full_name)} signed up`, 'Identity review required before activation',button('Review','goto','people','sm'))).join('')}${pending.slice(0,4).map(l=>mini(`${esc(nameOf(ctx,l.user_id))} requested ${esc(l.kind)} leave`,`${fmtDate(l.start_date)} — ${fmtDate(l.end_date)}`,button('Review','nav-inbox','', 'sm'))).join('')}${approvals.slice(0,3).map(a=>mini(esc(a.title),'HR plan awaiting executive sign-off',button('Review','nav-inbox','','sm'))).join('')}${!pending.length&&!approvals.length?empty('All caught up','No approval decisions are waiting.'):''}</div>`:isHr?`<div class="mini-list">${rows(ctx,'salary_corrections').filter(x=>x.status!=='resolved').slice(0,4).map(c=>mini('Salary clarification',esc(truncate(c.reason,100)),badge(c.status))).join('')}${contracts.filter(c=>daysUntil(c.end_date)<=30&&daysUntil(c.end_date)>=0).slice(0,3).map(c=>mini('Contract deadline',`${nameOf(ctx,c.user_id)} · ${fmtDate(c.end_date)}`,badge('pending'))).join('')}${!rows(ctx,'salary_corrections').length&&!contracts.length?empty('No urgent cases','Upcoming HR items will appear here.'):''}</div>`:`<div class="mini-list">${mine.filter(t=>t.status!=='done').slice(0,5).map(t=>mini(esc(t.title),`Due ${fmtDate(t.due_date)} · ${esc(t.priority||'Normal')} priority`,badge(t.status))).join('')}${!mine.length?empty('Your work is clear','Assigned tasks will show here.'):''}</div>`;
 const memberCards=(isHr||leadR(ctx))?`<div class="workload-grid">${people.slice(0,8).map(p=>{const w=workload(ctx,p);return `<div class="workload-card"><div class="wl-top">${avatar(p.full_name)}<div class="grow"><strong>${esc(p.full_name)}</strong><br><small>${esc(p.title)}</small></div>${badge(p.role)}</div><div class="wl-details"><span>${w.hours}/${w.cap}h estimated</span><span>${w.percent}%</span></div><div class="progress ${alertFor(ctx,p)}"><span style="width:${Math.min(100,w.percent)}%"></span></div></div>`}).join('')}</div>`:``;
 const quick=`<div class="quick-actions">${[['Request leave','leave','calendar'],['My attendance','attendance','clock'],['My tasks','tasks','tasks'],['Career passport','career','graduation']].map(([label,id,ic])=>`<button data-act="goto" data-id="${id}">${icon(ic)} ${label}</button>`).join('')}</div>`;
 return `<div class="stats">${top.join('')}</div><div class="tiles two">${card(isExecutive?'Items requiring your decision':isHr?'HR operations requiring review':'Your priority tasks',required,isHr?button('Open inbox','nav-inbox','', 'sm'):button('Open my tasks','goto','tasks','sm'))}${card('Workspace activity',`${chartHtml}`)}</div><div class="tiles two mt">${card(isHr||leadR(ctx)?'Team capacity overview':'Quick actions',memberCards||quick)}${card('Company updates',`<div class="mini-list">${rows(ctx,'announcements').slice(0,4).map(a=>mini(esc(a.title),esc(truncate(a.body,125)),`<span class="muted">${fmtDate(a.created_at)}</span>`)).join('')}${!rows(ctx,'announcements').length?empty('No updates yet','Announcements from HR will appear here.'):''}</div>`)}</div>`;
}

 const leaveHTML=isExec?card('Leave requests · executive approval',listTable(['Employee','Dates','Type','Reason','Decision'],leaves.map(l=>`<tr><td>${personCell(ctx,l.user_id)}</td><td>${fmtDate(l.start_date)} – ${fmtDate(l.end_date)}</td><td>${badge(l.kind)}</td><td>${esc(truncate(l.reason,75))}</td><td><div class="flex">${button('Approve','leave-approve',l.id,'sm primary')}${button('Reject','leave-reject',l.id,'sm')}</div></td></tr>`).join(''),'No leave requests waiting')):'<div class="notice mb">Leave approval is reserved for founder/CEO accounts. HR can view requests in the Leave section but cannot approve them.</div>';

 const salaryHTML=card('Salary discrepancy queue',listTable(['Employee','Issue','Status','Review'],corrections.map(c=>`<tr><td>${personCell(ctx,c.user_id)}</td><td>${esc(truncate(c.reason,140))}</td><td>${badge(c.status)}</td><td>${button('Review','correction-review',c.id,'sm')}</td></tr>`).join(''),'No salary disputes waiting'));
 return `<div class="tiles equal">${card('Decision snapshot',`<div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:0">${kpi('Pending leave',leaves.length,'Founder / CEO review','calendar')}${kpi('Action plans',actions.length,'Human approval before execution','shield')}</div>`)}${card('Operating principle','<div class="notice">No HR agent may approve leave, change compensation, renew a contract or deactivate an account automatically. High-impact actions require a named executive decision and an audit trail.</div>')}</div><div class="mt">${leaveHTML}</div>${isExec?`<div class="mt">${registrationHTML}</div>`:''}<div class="tiles two mt">${actionHTML}${salaryHTML}</div>`;

function people(ctx){
 const staff=rows(ctx,'profiles');
 const search=(ctx.filter||'').toLowerCase();
 const filtered=staff.filter(p=>[p.full_name,p.title,p.department,p.email].some(t=>String(t||'').toLowerCase().includes(search)));
 const pending=staff.filter(p=>p.signup_method==='self'&&p.registration_status==='pending'&&!p.active);
 const activeStaff=staff.filter(p=>p.active&&p.onboarded_at);
 const cards=filtered.map(p=>{
  const w=workload(ctx,p),status=p.registration_status==='pending'?'awaiting approval':p.registration_status==='rejected'?'rejected':p.active?'active':'inactive';
  return `<div class="workload-card"><div class="between">${avatar(p.full_name,'xl')}<div>${badge(status)}</div></div><div style="margin-top:16px"><h3>${esc(p.full_name)}</h3><p class="sub" style="margin-top:5px">${esc(p.title)} · ${esc(p.department)}</p></div><p class="sub" style="margin-top:8px">${esc(p.email)}</p><div class="wl-details" style="margin-top:20px"><span>${w.tasks} active tasks · ${w.hours}h</span><span>${w.percent}% capacity</span></div><div class="progress ${alertFor(ctx,p)}"><span style="width:${Math.min(100,w.percent)}%"></span></div><div class="between mt">${badge(p.role)}${hrR(ctx)&&(inR(ctx)||!['founder','ceo','admin'].includes(p.role))?button('Manage','person-manage',p.id,'sm'):''}${hrR(ctx)&&p.onboarded_at&&(inR(ctx)||!['founder','ceo','admin','hr'].includes(p.role))?button('Recovery link','invite-recover',p.email,'sm'):''}</div></div>`;
 }).join('');
 const invited=staff.filter(p=>p.signup_method==='invitation'&&!p.onboarded_at&&p.active);
 const requests=inR(ctx)?`<div class="mt">${card('New employee sign-ups · identity review',`<div class="notice warn mb">Sign-up is open, but email ownership is not automatically verified. Founder/CEO must independently verify each person before approving. Pending employees cannot read company records.</div>${listTable(['Applicant','Email','Requested','Decision'],pending.map(p=>`<tr><td><strong>${esc(p.full_name)}</strong></td><td>${esc(p.email)}</td><td>${fmtDate(p.registration_requested_at)}</td><td><div class="flex wrap">${button('Approve','registration-approve',p.id,'sm primary')}${button('Reject','registration-reject',p.id,'sm')}</div></td></tr>`).join(''),'No sign-up requests awaiting approval')}`)}</div>`:'';
 const inviteTable=hrR(ctx)?`<div class="mt">${card('Invitation links (optional)',listTable(['Email','Name','Role','Onboarding'],[
  ...rows(ctx,'invites').map(i=>`<tr><td>${esc(i.email)}</td><td>${esc(i.name)}</td><td>${badge(i.role)}</td><td>${button('Generate link','invite-issue',i.email,'sm')}</td></tr>`),
  ...invited.map(p=>`<tr><td>${esc(p.email)}</td><td>${esc(p.full_name)}</td><td>${badge(p.role)}</td><td>${button('Generate link','invite-issue',p.email,'sm')}</td></tr>`)
 ].join(''),'No pending invitations'))}</div>`:'';
 return `<div class="toolbar"><div class="flex wrap">${pill(`${activeStaff.length} active`)}${pill(`${pending.length} sign-up requests`)}${pill(`${invited.length} pending invite setup`)}${pill('Estimated hours from tasks')}</div><div class="flex">${button(`${icon('upload')} Import CSV`,'goto','import','sm')}${hrR(ctx)?button(`${icon('plus')} Invite member`,'invite-new','','primary'):''}</div></div>${requests}<div class="workload-grid mt">${cards||empty('Nobody found','Try a different name or role.')}</div>${inviteTable}`;

function attendance(ctx){const mine=own(ctx,'attendance'),active=mine.find(a=>!a.clock_out),mineSorted=[...mine].sort((a,b)=>String(b.clock_in).localeCompare(String(a.clock_in)));
 const ownTable=listTable(['Clock-in','Clock-out','Duration'],mineSorted.slice(0,30).map(a=>`<tr><td>${fmtTime(a.clock_in)}</td><td>${a.clock_out?fmtTime(a.clock_out):badge('active')}</td><td>${a.clock_out?((new Date(a.clock_out)-new Date(a.clock_in))/3600000).toFixed(2)+'h':'In progress'}</td></tr>`).join(''),'You have no attendance records');

function leave(ctx){const leaves=own(ctx,'leave_requests'),all=rows(ctx,'leave_requests');const pending=leaves.filter(x=>x.status==='pending'),approved=leaves.filter(x=>x.status==='approved');
 const table=listTable(['Type','Dates','Reason','Status','Reviewed'],[...leaves].sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))).map(x=>`<tr><td>${esc(x.kind)}</td><td>${fmtDate(x.start_date)} – ${fmtDate(x.end_date)}</td><td>${esc(truncate(x.reason,100))}</td><td>${badge(x.status)}</td><td>${fmtDate(x.reviewed_at)}</td></tr>`).join(''),'You have not requested time off');

function tasks(ctx){const mine=rows(ctx,'tasks'),filter=(ctx.filter||'').toLowerCase();const all=mine.filter(t=>[t.title,nameOf(ctx,t.assigned_to),t.priority].some(v=>String(v||'').toLowerCase().includes(filter)));
 const projectName=t=>rows(ctx,'projects').find(p=>p.id===t.project_id)?.name||'General work';

 const cols=[['todo','To do'],['in_progress','In progress'],['done','Done']];const board=`<div class="tiles three">${cols.map(([status,label])=>`<div class="panel"><div class="panel-head"><h2>${label}</h2>${pill(all.filter(t=>t.status===status).length)}</div><div class="rows">${all.filter(t=>t.status===status).map(t=>`<div class="workload-card"><div class="between"><span class="sub">${esc(projectName(t))}</span>${badge(t.priority||'Normal')}</div><h3 style="margin:16px 0">${esc(t.title)}</h3><div class="between"><div class="flex">${avatar(nameOf(ctx,t.assigned_to),'sm')}<small class="muted">${fmtDate(t.due_date)}</small></div><select class="filter" data-change="task-status" data-id="${t.id}" aria-label="Update task status"><option value="todo" ${t.status==='todo'?'selected':''}>To do</option><option value="in_progress" ${t.status==='in_progress'?'selected':''}>In progress</option><option value="done" ${t.status==='done'?'selected':''}>Done</option></select></div><p class="tagline" style="margin-top:15px">${icon('clock')} ${n(t.estimate_hours)}h estimated</p></div>`).join('')||empty('Nothing here','Drag-free status updates available on each task card.')}</div></div>`).join('')}</div>`;
 const tabList=listTable(['Task','Assignee','Project','Due','Priority','Status'],all.map(t=>`<tr><td><strong>${esc(t.title)}</strong><br><small>${n(t.estimate_hours)}h planned</small></td><td>${personCell(ctx,t.assigned_to)}</td><td>${esc(projectName(t))}</td><td>${fmtDate(t.due_date)}</td><td>${badge(t.priority||'Normal')}</td><td><select class="filter" data-change="task-status" data-id="${t.id}"><option value="todo" ${t.status==='todo'?'selected':''}>To do</option><option value="in_progress" ${t.status==='in_progress'?'selected':''}>In progress</option><option value="done" ${t.status==='done'?'selected':''}>Done</option></select></td></tr>`).join(''),'No tasks assigned yet');
 return `<div class="toolbar"><div class="flex">${button(`${icon('layers')} Board`,'task-board','','sm '+(ctx.taskView==='board'?'primary':''))}${button(`${icon('tasks')} List`,'task-list','','sm '+(ctx.taskView==='list'?'primary':''))}</div><div class="flex">${pill(`${all.length} visible tasks`)}${actions}</div></div>${ctx.taskView==='list'?card('Tasks',tabList):board}`;

function projects(ctx){const items=rows(ctx,'projects');return `<div class="toolbar"><p class="sub">Live project records. Tasks remain assigned to individual team members.</p>${leadR(ctx)?btn(`${icon('plus')} New project`,'project-new','primary'):''}</div><div class="tiles three">${items.map(p=>`<div class="panel"><div class="between"><span class="badge">${icon('briefcase',13)} Project</span>${badge(p.status)}</div><h2 style="margin-top:24px">${esc(p.name)}</h2><p class="sub" style="margin:9px 0 18px;min-height:40px">${esc(p.description||'No description yet')}</p><div class="between"><small class="muted">${rows(ctx,'tasks').filter(t=>t.project_id===p.id).length} tasks</small>${leadR(ctx)?button('Manage','project-manage',p.id,'sm'):''}</div></div>`).join('')||empty('No projects','Create your first workspace project.')}</div>`;}

function payroll(ctx){const staff=hrR(ctx),records=rows(ctx,'payroll_records').sort((a,b)=>String(b.period).localeCompare(String(a.period))),filtered=staff?records:records.filter(x=>x.user_id===ctx.user.id);
 const selected=filtered.find(p=>p.id===ctx.selectedPayroll)||filtered[0];const prev=selected?records.filter(p=>p.user_id===selected.user_id&&p.currency===selected.currency&&p.period<selected.period).sort((a,b)=>String(b.period).localeCompare(String(a.period)))[0]:null;
 const recon=selected?payrollReconciliation(selected,rows(ctx,'payroll_items')):null;const items=selected?rows(ctx,'payroll_items').filter(i=>i.payroll_id===selected.id):[];
 const net=selected?netPay(selected):0, prevNet=prev?netPay(prev):null;

function openModal(ctx,title,fields,onSubmit,{description='',submit='Save changes',wide=false}={}){
 document.querySelector('.modalveil')?.remove();
 const veil=document.createElement('div');veil.className='modalveil';
 veil.innerHTML=`<section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><div><h2>${esc(title)}</h2>${description?`<p>${esc(description)}</p>`:''}</div><button type="button" class="iconbtn" data-modal-close aria-label="Close">${icon('close')}</button></div><form class="modal-form"><div class="modalbody"><div class="form">${fields}</div><p class="modal-error notice danger" style="display:none;margin-top:16px" role="alert"></p></div><div class="modalfoot"><button type="button" class="btn" data-modal-close>Cancel</button><button type="submit" class="btn primary modal-submit">${icon('check')} ${esc(submit)}</button></div></form></section>`;
 document.body.appendChild(veil);
 const close=()=>veil.remove();veil.querySelectorAll('[data-modal-close]').forEach(b=>b.addEventListener('click',close));veil.addEventListener('mousedown',e=>{if(e.target===veil)close()});
 veil.querySelector('form').addEventListener('submit',async e=>{
  e.preventDefault();const form=e.currentTarget;const btn=form.querySelector('.modal-submit'),errorBox=form.querySelector('.modal-error');if(btn.disabled)return;btn.disabled=true;errorBox.style.display='none';
  try{const after=await onSubmit(new FormData(form));close();await ctx.refresh();if(typeof after==='function')await after();}
  catch(err){errorBox.textContent=err.message||'Save failed';errorBox.style.display='block';ctx.toast(err.message||'Could not save',true)}
  finally{btn.disabled=false;}
 });veil.querySelector('input,textarea,select')?.focus();return veil;
}

function showAuth(message='',savedEmail=''){
 ctx.profile=null;ctx.user=null;ctx.records={...FALLBACK};ctx.menuOpen=false;
 root.innerHTML=`<div class="auth-wrap"><section class="auth-hero"><div class="flex"><span class="brand-symbol">P</span><div><div class="nav-brand" style="font-size:18px">ParroDash</div><div class="overline" style="margin-top:5px">TPARRO WORKSPACE</div></div></div><div><span class="badge">PEOPLE · WORK · INTELLIGENCE</span><h1>Your people.<br>One beautiful<br>workspace.</h1><p>One place for your team, projects, attendance and growth. Register an account or sign in to your existing workspace.</p><div class="hero-pips"><i></i><i></i><i></i></div></div><p class="foot">PRIVATE HR DATA · FOUNDER-APPROVED STAFF ACCESS</p></section><section class="auth-form-wrap"><div class="auth-card"><span class="brand-symbol" style="margin-bottom:23px">P</span><div class="auth-tabs" role="tablist" aria-label="Account access"><button type="button" class="auth-tab selected" aria-selected="true" role="tab">Log in</button><button type="button" class="auth-tab" id="signup-toggle" role="tab" aria-selected="false">Sign up</button></div><div class="overline" style="margin-bottom:12px">WELCOME BACK</div><h2>Sign in to ParroDash</h2><p class="desc">Use your email and password, or create a new employee account without an invitation.</p>${message?`<p class="notice danger" role="alert" style="margin-bottom:18px">${esc(message)}</p>`:''}<form class="form" id="signin-form"><div class="field"><label for="login-email">Email address</label><input id="login-email" name="email" type="email" class="input" autocomplete="email" placeholder="you@example.com" value="${esc(savedEmail)}" required></div><div class="field"><label for="login-password">Password</label><input id="login-password" name="password" type="password" class="input" autocomplete="current-password" minlength="6" required placeholder="••••••••"></div><div class="between" style="margin-top:-7px"><button id="show-password" type="button" class="btn sm">Show password</button><button id="forgot-password" type="button" class="btn sm">Forgot password?</button></div><button type="submit" class="btn primary full">Sign in ${icon('arrow')}</button></form><div class="auth-footer">New employee? <button class="auth-link" type="button" id="signup-bottom">Create an account</button><br>New registrations need Founder/CEO identity review before HR access.</div></div></section></div>`;
 root.querySelector('#signin-form').onsubmit=async e=>{e.preventDefault();const form=e.target,submit=form.querySelector('[type=submit]');submit.disabled=true;const email=String(new FormData(form).get('email')||'').trim();try{const f=new FormData(form);const {error}=await db.auth.signInWithPassword({email,password:String(f.get('password'))});if(error)throw Error(error.message);await boot()}catch(err){showAuth('Sign-in failed: '+err.message,email)}finally{submit.disabled=false}};
 root.querySelector('#forgot-password').onclick=()=>showRecovery();
 root.querySelector('#signup-toggle').onclick=()=>showSignup();
 root.querySelector('#signup-bottom').onclick=()=>showSignup();
 root.querySelector('#show-password').onclick=()=>{const field=root.querySelector('#login-password');field.type=field.type==='password'?'text':'password';root.querySelector('#show-password').textContent=field.type==='password'?'Show password':'Hide password'};
}

function showSignup(message='',savedName='',savedEmail=''){
 ctx.profile=null;ctx.menuOpen=false;
 root.innerHTML=`<div class="auth-wrap"><section class="auth-hero"><div class="flex"><span class="brand-symbol">P</span><div><div class="nav-brand" style="font-size:18px">ParroDash</div><div class="overline" style="margin-top:5px">TPARRO WORKSPACE</div></div></div><div><span class="badge">GET STARTED</span><h1>Join the<br>workspace.</h1><p>Sign up with your own email and password. A TPARRO Founder/CEO reviews new employee registrations before access is granted.</p><div class="hero-pips"><i></i><i></i><i></i></div></div><p class="foot">NO INVITATION REQUIRED · EMPLOYEE ACCOUNTS ONLY</p></section><section class="auth-form-wrap"><div class="auth-card"><span class="brand-symbol" style="margin-bottom:23px">P</span><div class="auth-tabs" role="tablist" aria-label="Account access"><button type="button" class="auth-tab" id="login-toggle" role="tab" aria-selected="false">Log in</button><button type="button" class="auth-tab selected" role="tab" aria-selected="true">Sign up</button></div><div class="overline" style="margin-bottom:12px">NEW ACCOUNT</div><h2>Create your account</h2><p class="desc">No invite needed. Your account starts with Employee permissions and waits for approval.</p>${message?`<p class="notice danger" role="alert" style="margin-bottom:16px">${esc(message)}</p>`:''}<form class="form" id="signup-form"><div class="field"><label for="signup-name">Full name</label><input id="signup-name" class="input" name="name" autocomplete="name" minlength="2" maxlength="90" required value="${esc(savedName)}" placeholder="Your name"></div><div class="field"><label for="signup-email">Email address</label><input id="signup-email" class="input" name="email" type="email" autocomplete="email" required value="${esc(savedEmail)}" placeholder="you@example.com"></div><div class="field"><label for="signup-password">Create password</label><input id="signup-password" class="input" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="72" required placeholder="10+ characters, letters and a number"></div><div class="field"><label for="signup-confirm">Confirm password</label><input id="signup-confirm" class="input" name="confirm" type="password" autocomplete="new-password" minlength="10" maxlength="72" required placeholder="Repeat your password"></div><label class="auth-check"><input type="checkbox" name="agree" required> I understand access is granted after TPARRO verifies my identity and a Founder/CEO approves.</label><button class="btn primary full" type="submit">Create employee account ${icon('arrow')}</button></form><div class="auth-footer">Already registered? <button class="auth-link" id="login-bottom" type="button">Log in</button><br>Your email is not independently verified by this sign-up flow; management verifies identity before activation.</div></div></section></div>`;
 root.querySelector('#login-toggle').onclick=()=>showAuth('',savedEmail);
 root.querySelector('#login-bottom').onclick=()=>showAuth('',savedEmail);
 root.querySelector('#signup-form').onsubmit=async e=>{
  e.preventDefault();const form=e.currentTarget,submit=form.querySelector('[type=submit]'),f=new FormData(form);
  const name=String(f.get('name')||'').trim(),email=String(f.get('email')||'').trim().toLowerCase(),password=String(f.get('password')||'');
  if(password!==String(f.get('confirm')||'')){showSignup('Passwords do not match.',name,email);return}
  if(password.length<10||!/[a-z]/i.test(password)||!/[0-9]/.test(password)){showSignup('Choose at least 10 characters with letters and a number.',name,email);return}
  submit.disabled=true;submit.textContent='Creating account…';
  try{
   const {data,error}=await db.functions.invoke('public-signup',{body:{name,email,password}});
   if(error){let detail=error.message||'Registration is unavailable';try{detail=(await error.context?.json())?.error||detail}catch{}throw Error(detail)}
   if(data?.error||!data?.ok)throw Error(data?.error||'Registration could not be completed');
   const login=await db.auth.signInWithPassword({email,password});
   if(login.error){showAuth('Account created, but automatic sign-in failed. Please sign in with your new password.',email);return}
   await boot();
  }catch(err){showSignup(err.message||'Sign-up failed. Please try again.',name,email)}
 };
}

function showPendingRegistration(profile){
 const rejected=profile.registration_status==='rejected';
 root.innerHTML=`<div class="auth-wrap"><section class="auth-hero"><span class="brand-symbol">P</span><div><h1>${rejected?'Registration<br>not approved.':'You are<br>almost in.'}</h1><p>${rejected?'Please contact TPARRO management if you believe this decision is incorrect.':'Your account was created. The Founder/CEO needs to verify your identity and approve your employee access.'}</p></div><p class="foot">PRIVATE STAFF WORKSPACE · APPROVAL REQUIRED</p></section><section class="auth-form-wrap"><div class="auth-card"><div class="overline">${rejected?'ACCOUNT REVIEW COMPLETE':'ACCOUNT CREATED'}</div><h2 style="margin:16px 0 12px">${rejected?'Request declined':'Awaiting Founder approval'}</h2><p class="desc">${esc(profile.full_name||'Employee')} · ${esc(profile.email||'')}<br>${rejected?'Your company data access remains disabled.':'Sign-up was successful. No further invitation is required. HR data stays private until approval.'}</p><div class="notice ${rejected?'danger':'warn'}">${rejected?'Please speak with TPARRO Founder/CEO.':'Contact TPARRO Founder/CEO so they can verify you and approve your account from People → Sign-up requests.'}</div><div class="flex wrap mt"><button class="btn primary" id="status-refresh" type="button">Check approval status</button><button class="btn" id="pending-logout" type="button">Sign out</button></div></div></section></div>`;
 root.querySelector('#status-refresh').onclick=async()=>{try{await boot()}catch(err){showPendingRegistration(profile)}};
 root.querySelector('#pending-logout').onclick=async()=>{await db.auth.signOut();showAuth()};
}

function showRecovery(message=''){
 ctx.profile=null;
 root.innerHTML=`<div class="auth-wrap"><section class="auth-hero"><div class="flex"><span class="brand-symbol">P</span><h2>ParroDash</h2></div><div><h1>Back to<br>your workspace.</h1><p>Recovery links require proof of email ownership. New accounts can be created from the Sign up screen.</p></div><p class="foot">TPARRO · SECURE RECOVERY</p></section><section class="auth-form-wrap"><div class="auth-card"><div class="overline">ACCOUNT RECOVERY</div><h2 style="margin-top:14px">Reset your password</h2><p class="desc">Enter the email address linked to your ParroDash account. If email delivery is enabled, we will send a private recovery link.</p>${message?`<div class="notice" role="status">${esc(message)}</div>`:''}<form class="form" id="recovery-form"><div class="field"><label for="recover-email">Account email</label><input id="recover-email" class="input" name="email" autocomplete="email" type="email" required placeholder="your@email.com" /></div><button class="btn primary full" type="submit">Send recovery link</button></form><div class="auth-footer"><button id="back-login" type="button" class="btn sm">Back to sign in</button><p style="margin-top:10px">If an employee has not activated their account yet, TPARRO HR must issue a fresh activation link. External SMTP is required for password reset emails to arbitrary addresses.</p></div></div></section></div>`;
 root.querySelector('#back-login').onclick=()=>showAuth();
 root.querySelector('#recovery-form').onsubmit=async e=>{
  e.preventDefault();const form=e.target,button=form.querySelector('[type=submit]');button.disabled=true;
  const email=String(new FormData(form).get('email')||'').trim().toLowerCase();
  try{
   const redirectTo=location.origin+location.pathname+'?recovery=1';
   const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo});
   if(error)throw error;
   showRecovery('Recovery request accepted. Check your inbox or spam folder. If nothing arrives, your address may not be authorised by the email provider; contact TPARRO HR.');
  }catch(err){
   const msg=String(err.code||'').includes('email_address_not_authorized')||/not authorized|not authorised|smtp/i.test(err.message||'')
     ?'Password reset email delivery is not available for this address yet. Your administrator must configure custom SMTP in Supabase Auth. Do not share your password with anyone.'
     :err.message||'Recovery email could not be sent';
   showRecovery(msg);
  }finally{button.disabled=false}
 };
}
function showResetPassword(message=''){
 root.innerHTML=`<div class="auth-wrap"><section class="auth-hero"><span class="brand-symbol">P</span><div><h1>Set a new<br>password.</h1><p>Your recovery link was verified. Choose a new unique password for ParroDash.</p></div><p class="foot">TPARRO · PASSWORD RECOVERY</p></section><section class="auth-form-wrap"><div class="auth-card"><div class="overline">SECURE PASSWORD CHANGE</div><h2 style="margin-top:14px">Change password</h2>${message?`<div class="notice danger" role="alert">${esc(message)}</div>`:''}<form class="form" id="new-password-form"><div class="field"><label for="reset-new-password">New password</label><input id="reset-new-password" class="input" name="password" type="password" autocomplete="new-password" minlength="10" required /></div><div class="field"><label for="reset-confirm-password">Confirm password</label><input id="reset-confirm-password" class="input" name="confirm" type="password" autocomplete="new-password" minlength="10" required /></div><button class="btn primary full" type="submit">Save new password</button></form></div></section></div>`;
 root.querySelector('#new-password-form').onsubmit=async e=>{
  e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;
  const f=new FormData(e.target),password=String(f.get('password')||'');
  if(password!==f.get('confirm')){showResetPassword('Passwords do not match');return}
  try{const {error}=await db.auth.updateUser({password});if(error)throw error;await db.auth.signOut();showAuth('Password updated. Sign in using your new password.')}catch(err){showResetPassword(err.message||'Password change failed')}
 };
}
async function consumeRecoveryRedirect(){
 const query=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.replace(/^#/,''));
 if(!query.has('recovery')&&hash.get('type')!=='recovery')return false;
 root.innerHTML='<div class="boot-loading"><span class="brand-symbol">P</span><p>Verifying recovery link...</p></div>';
 const access=hash.get('access_token'),refresh=hash.get('refresh_token'),code=query.get('code'),token=hash.get('token_hash')||query.get('token_hash');
 let result={error:new Error('Recovery link did not contain valid session credentials')};
 if(access&&refresh)result=await db.auth.setSession({access_token:access,refresh_token:refresh});
 else if(code)result=await db.auth.exchangeCodeForSession(code);
 else if(token)result=await db.auth.verifyOtp({token_hash:token,type:'recovery'});
 history.replaceState(null,'',location.pathname);
 if(result.error){showAuth('Recovery link invalid or expired. '+result.error.message);return true}
 showResetPassword();return true;
}
function showSetup(){root.innerHTML=`<div class="auth-wrap"><section class="auth-hero"><div class="flex"><span class="brand-symbol">P</span><h3>ParroDash</h3></div><div><h1>Your next<br>chapter starts<br>here.</h1><p>Securely activate your TPARRO workspace account. No team data is visible until activation is complete.</p></div><p class="foot">SECURE ACCOUNT SETUP</p></section><section class="auth-form-wrap"><div class="auth-card"><div class="overline" style="margin-bottom:15px">STEP 1 OF 1</div><h2>Activate your account</h2><p class="desc">Set a strong password for ${esc(ctx.profile?.email)}.</p><form class="form" id="setup-form"><div class="field"><label>New password</label><input class="input" type="password" name="password" autocomplete="new-password" minlength="10" required></div><div class="field"><label>Repeat password</label><input class="input" type="password" name="confirm" autocomplete="new-password" minlength="10" required></div><button type="submit" class="btn primary full">Activate & open workspace</button></form><div class="auth-footer">Use at least 10 characters, preferably a unique phrase.</div></div></section></div>`;
 root.querySelector('#setup-form').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{const f=new FormData(e.target),password=String(f.get('password'));if(password!==f.get('confirm'))throw Error('Passwords do not match');const {error}=await db.auth.updateUser({password});if(error)throw Error(error.message);const result=await db.rpc('finish_onboarding');if(result.error||result.data!==true)throw Error(result.error?.message||'Account activation failed');await boot();ctx.toast('Account activated')}catch(err){ctx.toast(err.message,true)}finally{button.disabled=false}};
}
async function showPublicPassport(token){root.innerHTML='<div class="boot-loading"><span class="brand-symbol">P</span><p>Opening verified credentials...</p></div>';try{const {data,error}=await db.rpc('read_career_share',{p_token:token});if(error||!data)throw Error('Share link is invalid, revoked, or expired');const skills=data.skills||[],training=data.training||[];
 root.innerHTML=`<div class="auth-wrap"><section class="auth-hero"><div><span class="brand-symbol">P</span><span style="margin-left:15px;font-weight:700">ParroDash</span></div><div><span class="badge success">Verified share</span><h1>Skills worth<br>sharing.</h1><p>This passport was shared by its owner. Only credentials verified in TPARRO are displayed, with no payroll, private cases or contact data.</p></div><p class="foot">EMPLOYEE-CONTROLLED VERIFIED PORTFOLIO</p></section><section class="auth-form-wrap"><div class="auth-card" style="width:min(100%,460px)"><h1>${esc(data.name)}</h1><p class="sub" style="margin:9px 0 20px">${esc(data.title)} · ${esc(data.department)}</p><div class="line"></div><h3>Verified skills</h3><div class="rows mt">${skills.map(s=>`<div class="between"><strong>${esc(s.name)}</strong><span class="badge success">Level ${Number(s.level)} / 5</span></div>`).join('')||'<p class="sub">No verified skills to share.</p>'}</div><div class="line"></div><h3>Verified training</h3><div class="rows mt">${training.map(t=>`<div class="rowline"><div><strong>${esc(t.title)}</strong><p class="sub">${esc(t.provider)} · ${fmtDate(t.date)}</p></div></div>`).join('')||'<p class="sub">No verified training to share.</p>'}</div><div class="mt"><a href="/" class="btn">Go to ParroDash</a></div></div></section></div>`;
 }catch(e){root.innerHTML=`<div class="boot-loading"><span class="brand-symbol">P</span><h2>Link unavailable</h2><p>${esc(e.message)}</p><a href="/" class="btn">Back to workspace</a></div>`}}

async function boot(){root.innerHTML='<div class="boot-loading"><span class="brand-symbol">P</span><p>Loading your secure workspace...</p></div>';const {data,error}=await db.auth.getUser();if(error||!data.user)return showAuth();ctx.user=data.user;
 // Claims are checked by database policies. The client never decides authorization from email or user metadata.
 const claim=await db.rpc('claim_existing_invitation');if(claim.error)console.warn('Invite claim could not be completed:',claim.error.message);
 const p=await db.from('profiles').select('*').eq('id',ctx.user.id).maybeSingle();if(p.error)return showAuth('Employee profile failed to load: '+p.error.message);
 if(p.data&&!p.data.active&&p.data.signup_method==='self'){showPendingRegistration(p.data);return}
 if(!p.data||!p.data.active){root.innerHTML=`<div class="boot-loading"><span class="brand-symbol">P</span><h2>Account not authorized</h2><p>If you registered yourself, wait for Founder/CEO approval. Otherwise contact TPARRO HR to reactivate your account.</p><button class="btn" id="logout-btn">Sign out</button></div>`;document.getElementById('logout-btn').onclick=async()=>{await db.auth.signOut();showAuth()};return}
 ctx.profile=p.data;if(!ctx.profile.onboarded_at)return showSetup();await ctx.refresh();}

async function verifyInvite(){const args=new URLSearchParams(location.hash.replace(/^#/,'')),token=args.get('pd_token'),type=args.get('pd_flow');if(!token)return false;history.replaceState(null,'',location.pathname+location.search);
 if(!['invite','recovery'].includes(type)){showAuth('Invalid activation link');return true}
 root.innerHTML='<div class="boot-loading"><span class="brand-symbol">P</span><p>Verifying your one-time invitation...</p></div>';
 const {error}=await db.auth.verifyOtp({token_hash:token,type});if(error){showAuth('Invitation link invalid or expired. Ask HR to generate a new one. '+error.message);return true}
 if(type==='recovery'){const {data:identity}=await db.auth.getUser();if(identity?.user){const {data:p}=await db.from('profiles').select('onboarded_at').eq('id',identity.user.id).maybeSingle();if(p?.onboarded_at){showResetPassword();return true}}}await boot();return true;}

function openCommand(){const old=document.querySelector('.commandback');old?.remove();const links=linksFor(ctx);const veil=document.createElement('div');veil.className='commandback';veil.innerHTML=`<section class="command" role="dialog" aria-label="Quick search"><input type="search" id="command-input" placeholder="Search pages, people or tasks..." autocomplete="off" autofocus><div class="command-results" id="command-results"></div></section>`;document.body.appendChild(veil);
 const search=veil.querySelector('input'),results=veil.querySelector('#command-results');const renderResults=()=>{const q=search.value.trim().toLowerCase(),pages=links.filter(([key,item])=>!q||item.title.toLowerCase().includes(q)||key.includes(q)),members=ctx.records.profiles.filter(p=>q&&`${p.full_name} ${p.title}`.toLowerCase().includes(q)).slice(0,8);results.innerHTML=pages.slice(0,12).map(([key,item])=>`<button data-command-nav="${key}">${icon(item.icon)} ${esc(item.title)}</button>`).join('')+members.map(p=>`<button data-command-person="${p.id}">${icon('users')} ${esc(p.full_name)} <small class="muted">${esc(p.title)}</small></button>`).join('')+(!pages.length&&!members.length?'<p class="sub" style="padding:18px">No matching pages or team members</p>':'');};
 const close=()=>{veil.remove();ctx.commandOpen=false};veil.addEventListener('mousedown',e=>{if(e.target===veil)close()});veil.addEventListener('click',e=>{const target=e.target.closest('[data-command-nav],[data-command-person]');if(!target)return;if(target.dataset.commandNav){close();ctx.goto(target.dataset.commandNav)}else{close();ctx.filter=ctx.records.profiles.find(p=>p.id===target.dataset.commandPerson)?.full_name||'';ctx.goto(lead(ctx.profile)?'people':'tasks');ctx.filter=ctx.records.profiles.find(p=>p.id===target.dataset.commandPerson)?.full_name||'';ctx.render()}});
 search.addEventListener('input',renderResults);search.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'){e.preventDefault();const first=results.querySelector('button');if(first)first.click();else{close();ctx.filter=search.value;ctx.render()}}});renderResults();setTimeout(()=>search.focus(),0);
}

// Delegated handlers cover everything, including dialogs opened after initial render.
document.addEventListener('click',async e=>{
 const nav=e.target.closest('[data-nav]');if(nav){ctx.goto(nav.dataset.nav);return}
 const target=e.target.closest('[data-act]');if(!target){if(ctx.menuOpen&&!e.target.closest('.navside')&&!e.target.closest('.apphead')){ctx.menuOpen=false;ctx.render()}return}
 const act=target.dataset.act;
 if(act==='collapse'){ctx.menuOpen=!ctx.menuOpen;ctx.render();return}
 if(act==='command'){ctx.commandOpen=true;openCommand();return}
 try{await handleAction(ctx,act,target)}catch(err){console.error(err);ctx.toast(err.message||'Action failed',true)}
});
document.addEventListener('change',async e=>{const c=e.target.closest('[data-change]');if(!c)return;try{await handleChange(ctx,c)}catch(err){ctx.toast(err.message,true)}});
document.addEventListener('submit',async e=>{const form=e.target;if(!['agent-form','scenario-form','csv-form'].includes(form.id))return;e.preventDefault();await ctx.run(async()=>{await handleForm(ctx,form)})});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!ctx.profile)return;ctx.commandOpen=true;openCommand()}if(e.key==='Escape'){document.querySelector('.modalveil')?.remove();document.querySelector('.commandback')?.remove();ctx.commandOpen=false}});
// Safe initial routing. Shared passports never access the authenticated HR state.
(async()=>{const passport=new URLSearchParams(location.search).get('passport');if(passport){await showPublicPassport(passport);return}if(await verifyInvite())return;if(await consumeRecoveryRedirect())return;await boot()})().catch(e=>{console.error(e);showAuth('Unable to initialize workspace. '+e.message)});
</script>
</body></html>
